<canvas id="c" width="1920" height="1080"></canvas>
<script>
// ---------- Config ----------
const W = 1920, H = 1080;
const LOOP = 432;            // seconds (7:12, the length of "Rattle!"); animation repeats seamlessly
const SONG_BPM = 76;         // "Rattle!" tempo; head nods land on this beat
const BPM = SONG_BPM * 2;    // dance moves run double time
const BONE = '#f3eedf';
const GOLD = '#e8b84a';
const FLOWER_COLORS = ['#ff6f91', '#ffd23f', '#ffffff', '#c77dff', '#ff595e', '#ff9f1c', '#7bdff2'];

// KJV (public domain). [start, end, text, reference]
const VERSES = [
  [0,   8,   'Son of man, can these bones live?', 'Ezekiel 37:3'],
  [8,   19,  'O ye dry bones, hear the word of the LORD.', 'Ezekiel 37:4'],

  [40,  52,  'And shall put my spirit in you, and ye shall live.', 'Ezekiel 37:14'],
  [52,  64,  'When the man was let down, and touched the bones of Elisha, he revived, and stood up on his feet.', '2 Kings 13:21'],

  [76,  88,  'I am the resurrection, and the life: he that believeth in me, though he were dead, yet shall he live.', 'John 11:25'],
  [88,  100, 'The dead shall hear the voice of the Son of God: and they that hear shall live.', 'John 5:25'],

  [120, 132, 'He that raised up Christ from the dead shall also quicken your mortal bodies by his Spirit that dwelleth in you.', 'Romans 8:11'],

  [144, 156, 'Thou hast turned for me my mourning into dancing.', 'Psalm 30:11'],
  [156, 168, 'Let them praise his name in the dance.', 'Psalm 149:3'],
  [168, 180, 'The breath came into them, and they lived, and stood up upon their feet, an exceeding great army.', 'Ezekiel 37:10'],

  [189, 200, 'And David danced before the LORD with all his might.', '2 Samuel 6:14'],
  [200, 212, 'The trumpet shall sound, and the dead shall be raised incorruptible.', '1 Corinthians 15:52'],
  [212, 224, 'I am he that liveth, and was dead; and, behold, I am alive for evermore.', 'Revelation 1:18'],
  [224, 236, 'Praise him with the timbrel and dance: praise him with stringed instruments and organs.', 'Psalm 150:4'],
  [236, 248, 'O death, I will be thy plagues; O grave, I will be thy destruction.', 'Hosea 13:14'],
  [248, 260, 'He is not here: for he is risen, as he said.', 'Matthew 28:6'],
  [260, 272, 'His word was in mine heart as a burning fire shut up in my bones.', 'Jeremiah 20:9'],
  [272, 284, 'But thanks be to God, which giveth us the victory through our Lord Jesus Christ.', '1 Corinthians 15:57'],
  [284, 296, 'Like as Christ was raised up from the dead by the glory of the Father, even so we also should walk in newness of life.', 'Romans 6:4'],
  [296, 308, 'I will… put breath in you, and ye shall live; and ye shall know that I am the LORD.', 'Ezekiel 37:6'],
  [308, 320, 'To give unto them beauty for ashes, the oil of joy for mourning, the garment of praise for the spirit of heaviness.', 'Isaiah 61:3'],
  [320, 329, 'In thy presence is fulness of joy.', 'Psalm 16:11'],
  [329, 341, 'The flowers appear on the earth; the time of the singing of birds is come.', 'Song of Solomon 2:12'],
  [341, 353, 'The desert shall rejoice, and blossom as the rose.', 'Isaiah 35:1'],
  [353, 365, 'Behold, how good and how pleasant it is for brethren to dwell together in unity!', 'Psalm 133:1'],
  [365, 377, 'There is one body, and one Spirit, even as ye are called in one hope of your calling.', 'Ephesians 4:4'],
  [377, 389, 'The grass withereth, the flower fadeth: but the word of our God shall stand for ever.', 'Isaiah 40:8'],
  [389, 404, 'O death, where is thy sting? O grave, where is thy victory?', '1 Corinthians 15:55'],
  [404, 417, 'The dead in Christ shall rise first… caught up together with them in the clouds, to meet the Lord in the air.', '1 Thessalonians 4:16–17'],
  [417, 431, 'And God shall wipe away all tears from their eyes; and there shall be no more death.', 'Revelation 21:4'],
];

// Phase timings (seconds)
const T_DANCE0 = 35;                 // first skeleton dances; also the dance beat's zero point
const T_FIRE0 = 108;                 // 1:48 fire builds in the background
const T_NOD0 = 180, T_NOD1 = 188;    // 3:00 everyone slows down and nods together
const T_WHOA = 319;                  // 5:19 everyone hits the whoa together
const T_TOGETHER = 329;              // 5:29 synchronized dance with flowers
const T_ASC = 405;                   // 6:45 bones rise up in rays of light
const T_BLACK0 = 426, T_BLACK1 = 431; // fade to black, ready to restart at 7:12
const nodTogether = t => smooth(T_NOD0 - 3, T_NOD0, t) * (1 - smooth(T_NOD1, T_NOD1 + 3, t));
// after the nod, each skeleton works up to wild dancing on its own schedule
const wildness = (sk, t) => smooth(T_NOD1 + sk.wildDelay, T_NOD1 + sk.wildDelay + 14, t) * (1 - smooth(T_WHOA - 4, T_WHOA, t));
const whoaLevel = t => smooth(T_WHOA - 1.5, T_WHOA, t) * (1 - smooth(T_TOGETHER - 1, T_TOGETHER + 1, t));
const together = t => smooth(T_TOGETHER - 2, T_TOGETHER + 1, t);
const bloom = t => smooth(T_TOGETHER, T_TOGETHER + 4, t);
const fireLevel = t => smooth(T_FIRE0, T_FIRE0 + 14, t) * (1 - smooth(T_ASC, T_ASC + 8, t)) *
  (0.8 + 0.4 * smooth(T_NOD1 + 5, T_NOD1 + 20, t) * (1 - smooth(T_TOGETHER - 4, T_TOGETHER, t)) - 0.25 * bloom(t));

// ---------- Deterministic random ----------
function rng(seed) { return () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }; }
const R = rng(1031);

// ---------- Math helpers ----------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const easeIn = k => k * k * k;
const smooth = (a, b, t) => ease(clamp((t - a) / (b - a), 0, 1));
function lerpAng(a, b, k) { let d = ((b - a + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI; return a + d * k; }

// ---------- Skeleton definitions ----------
// Row of skeletons: back row smaller/dimmer ("an exceeding great army")
const SKELETONS = [];
[[400, 870, 250, 0.55], [770, 870, 250, 0.55], [1150, 870, 250, 0.55], [1520, 870, 250, 0.55]]
  .forEach(([x, g, h, a]) => SKELETONS.push({ x, ground: g, h, alpha: a }));
[[220, 1030, 390, 1], [580, 1030, 390, 1], [960, 1030, 390, 1], [1340, 1030, 390, 1], [1700, 1030, 390, 1]]
  .forEach(([x, g, h, a]) => SKELETONS.push({ x, ground: g, h, alpha: a }));
SKELETONS.forEach((s, i) => {
  s.moveOffset = i % 5;
  s.phase = (i * 0.37) % 1;
  s.lieDir = -1;
  s.listener = i === 3 || i === 5; // these two just bob their heads to the music
  s.alive = { tR: 0, tA: 0, tS0: 0, tS1: 0, tD: 0, spread: 3 };
  s.wildDelay = ((i * 0.618) % 1) * 9;
  s.flower = FLOWER_COLORS[i % FLOWER_COLORS.length];
});

const PIECES = ['spine', 'ribs', 'pelvis', 'skull',
  'humL', 'radL', 'handL', 'humR', 'radR', 'handR',
  'femL', 'tibL', 'footL', 'femR', 'tibR', 'footR'];

// Wake-up order: one skeleton first, then one more joins every 17 s; all nine dancing before 3:00.
// Each: rattle (tR) → bones fly together (tA) → lie assembled → stand up (tS0..tS1) → dance (tD).
const WAKE_ORDER = [6, 5, 7, 2, 1, 4, 8, 3, 0];
WAKE_ORDER.forEach((i, n) => {
  const a = SKELETONS[i].alive;
  if (n === 0) Object.assign(a, { tR: 8, tA: 19, tS0: 30, tS1: 35, tD: 35, spread: 5.5 });
  else { const tD = 35 + n * 17; Object.assign(a, { tR: tD - 17, tA: tD - 13, tS0: tD - 5, tS1: tD, tD, spread: 3 }); }
  SKELETONS[i].tAsc = T_ASC + (8 - n) * 1.25; // last to wake is first to rise
});

// Scattered resting spots for every bone (on the ground, random rotations)
SKELETONS.forEach(s => {
  s.scatter = {};
  PIECES.forEach(p => {
    s.scatter[p] = {
      x: s.x + (R() - 0.5) * s.h * 1.1,
      y: s.ground - 4 - R() * s.h * 0.06,
      rot: R() * Math.PI * 2,
      delay: R() * 5.5,
      arc: 80 + R() * 160,
      fallDelay: R() * 1.8,
      jit: R() * 100,
    };
  });
});

// ---------- Dance moves: joint angles (radians, 0 = pointing straight down) ----------
function move(id, b) {
  // b = beat position (continuous); s = sin on beat
  const s = Math.sin(b * Math.PI), c = Math.cos(b * Math.PI), s2 = Math.sin(b * Math.PI * 2);
  const P = { lean: 0, bob: 0, sx: 0, shL: 0.25, elL: 0.2, shR: -0.25, elR: -0.2, hipL: 0.08, knL: 0, hipR: -0.08, knR: 0, head: 0, jaw: 0, nod: 0 };
  switch (id) {
    case 0: // praise: both arms high, waving
      P.shL = 2.75 + 0.25 * s; P.elL = 0.3 * s; P.shR = -2.75 + 0.25 * s; P.elR = 0.3 * s;
      P.bob = Math.abs(s2) * 0.06; P.knL = -0.25 * Math.abs(s2); P.knR = -0.25 * Math.abs(s2);
      P.hipL = 0.12 * Math.abs(s2); P.hipR = -0.12 * Math.abs(s2) + 0.04; P.lean = 0.08 * s; P.head = 0.15 * s; P.jaw = Math.abs(s2);
      break;
    case 1: // sway: arms swing side to side, hips move
      P.lean = 0.14 * s; P.sx = 0.12 * s;
      P.shL = 1.2 + 0.9 * s; P.elL = 0.9; P.shR = -1.2 + 0.9 * s; P.elR = -0.9;
      P.hipL = 0.15 + 0.1 * s; P.hipR = -0.15 + 0.1 * s; P.knL = -0.2 * Math.max(0, -s); P.knR = 0.2 * Math.max(0, s);
      P.head = -0.2 * s; P.jaw = Math.abs(s);
      break;
    case 2: // kicks: alternate legs, hands on hips
      { const k = Math.max(0, s), j = Math.max(0, -s);
        P.hipL = 0.1 + 1.3 * k; P.knL = -0.4 * k; P.hipR = -0.1 - 1.3 * j; P.knR = 0.4 * j;
        P.shL = 0.7; P.elL = -1.6; P.shR = -0.7; P.elR = 1.6; P.lean = 0.12 * (j - k); P.bob = 0.04 * Math.abs(s2); P.jaw = Math.abs(s2); }
      break;
    case 3: // jumping jacks
      { const o = (1 - c) / 2;
        P.shL = 0.25 + 2.6 * o; P.elL = 0.2; P.shR = -0.25 - 2.6 * o; P.elR = -0.2;
        P.hipL = 0.06 + 0.45 * o; P.hipR = -0.06 - 0.45 * o; P.bob = 0.05 * Math.abs(s); P.jaw = o; }
      break;
    case 4: // raise-the-roof bounce
      { const u = Math.abs(s2);
        P.shL = 1.5 + 0.4 * u; P.elL = 1.3 - 0.5 * u; P.shR = -1.5 - 0.4 * u; P.elR = -1.3 + 0.5 * u;
        P.knL = -0.7 * (1 - u); P.knR = 0.7 * (1 - u); P.hipL = 0.35 * (1 - u); P.hipR = -0.35 * (1 - u); P.head = 0.25 * Math.sin(b * Math.PI / 2); P.jaw = u; }
      break;
    case 5: // listener: hands on hips, head bobbing on the song's beat, foot tapping
      { const n = Math.pow(Math.abs(Math.sin(b * Math.PI / 2)), 3);
        P.nod = n; P.head = 0.06 * Math.sin(b * Math.PI / 4); P.lean = 0.04 * Math.sin(b * Math.PI / 4);
        P.shL = 0.7; P.elL = -1.6; P.shR = -0.7; P.elR = 1.6;
        P.hipR = -0.12 - 0.12 * n; P.knR = 0.25 * n; P.hipL = 0.1; P.sx = 0.03 * Math.sin(b * Math.PI / 4); }
      break;
    // ---- wild moves (blended in by wildness) ----
    case 6: // windmill flail with big jumps
      { const j = Math.abs(Math.sin(b * Math.PI));
        P.shL = 1.6 + 2.6 * Math.sin(b * Math.PI); P.elL = 0.6 * c; P.shR = -1.6 + 2.6 * Math.sin(b * Math.PI + 1.5); P.elR = -0.6 * c;
        P.hipL = 0.3 + 0.5 * j; P.knL = -0.9 * j; P.hipR = -0.3 - 0.5 * j; P.knR = 0.9 * j;
        P.bob = 0.16 * j; P.lean = 0.25 * s; P.head = 0.5 * s2; P.jaw = j; P.sx = 0.25 * Math.sin(b * Math.PI / 4); }
      break;
    case 7: // headbang with air-guitar arms
      { const n = Math.abs(Math.sin(b * Math.PI));
        P.nod = 1.6 * n; P.lean = 0.2 * s2; P.head = 0.35 * s;
        P.shL = 1.0 + 0.4 * n; P.elL = 1.4; P.shR = -0.9; P.elR = -1.2 - 0.9 * n;
        P.hipL = 0.35; P.knL = -0.5; P.hipR = -0.35; P.knR = 0.5; P.bob = 0.04 * n; P.jaw = n; }
      break;
    case 8: // high-kick frenzy, arms up
      { const k = Math.max(0, s), q = Math.max(0, -s);
        P.hipL = 0.1 + 1.9 * k; P.knL = -0.2 * k; P.hipR = -0.1 - 1.9 * q; P.knR = 0.2 * q;
        P.shL = 2.6 + 0.4 * s2; P.elL = 0.4 * s; P.shR = -2.6 + 0.4 * s2; P.elR = 0.4 * s;
        P.bob = 0.1 * Math.abs(s2); P.lean = 0.2 * (q - k); P.jaw = Math.abs(s2); P.sx = 0.3 * Math.sin(b * Math.PI / 8); }
      break;
  }
  return P;
}
const REST = { lean: 0, bob: 0, sx: 0, shL: 0.12, elL: 0.05, shR: -0.12, elR: -0.05, hipL: 0.05, knL: 0, hipR: -0.05, knR: 0, head: 0, jaw: 0, nod: 0 };
function mixPose(a, b, k) { const o = {}; for (const key in a) o[key] = lerp(a[key], b[key], k); return o; }

function dancePose(sk, t) {
  const b0 = (t - T_DANCE0) * BPM / 60;            // shared beat
  const beat = b0 + (sk.listener ? 0 : sk.phase);  // this skeleton's own groove
  const seg = 8; // seconds per move
  const idx = Math.floor((t - T_DANCE0) / seg);
  const f = ((t - T_DANCE0) / seg) - idx;
  const blend = smooth(0.85, 1, f);
  let P;
  if (sk.listener) P = move(5, beat);
  else {
    const m0 = (idx + sk.moveOffset) % 5, m1 = (idx + 1 + sk.moveOffset) % 5;
    P = mixPose(move(m0, beat), move(m1, beat), blend);
  }
  // wild, each on its own: listeners headbang; dancers cycle flail / headbang / high kicks
  const w = wildness(sk, t);
  if (w > 0) {
    let wild;
    if (sk.listener) wild = move(7, beat);
    else {
      const WILD = [6, 7, 8, 6, 8];
      wild = mixPose(move(WILD[(idx + sk.moveOffset) % 5], beat), move(WILD[(idx + 1 + sk.moveOffset) % 5], beat), blend);
    }
    P = mixPose(P, wild, w);
  }
  // 3:00 slow down: everyone nods together on the song's beat
  const nw = nodTogether(t);
  if (nw > 0) P = mixPose(P, move(5, b0), nw);
  // 5:19 everyone hits the whoa together
  const hw = whoaLevel(t);
  if (hw > 0) P = mixPose(P, whoaPose(b0), hw);
  // 5:29 everyone dances the same moves in sync
  const tw = together(t);
  if (tw > 0) {
    const M = [0, 1, 3, 4], j = Math.max(0, Math.floor((t - T_TOGETHER) / seg)), g = smooth(0.85, 1, ((t - T_TOGETHER) / seg) - j);
    P = mixPose(P, mixPose(move(M[j % 4], b0), move(M[(j + 1) % 4], b0), g), tw);
  }
  // 6:45 arms lift in praise as they rise
  const aw = smooth(sk.tAsc - 4, sk.tAsc, t);
  if (aw > 0) P = mixPose(P, move(0, b0 * 0.25), aw);
  return P;
}

// "Hit the whoa": fists swing across the body and snap to a stop on each song beat, alternating sides
function whoaSide(side) {
  const P = { lean: -0.12 * side, bob: 0, sx: 0.04 * side, head: 0.22 * side, jaw: 1, nod: 0,
              hipL: 0.25, knL: -0.35, hipR: -0.25, knR: 0.35 };
  if (side > 0) Object.assign(P, { shL: -1.2, elL: -0.37, shR: -0.9, elR: -0.9 });
  else Object.assign(P, { shL: 0.9, elL: 0.9, shR: 1.2, elR: 0.37 });
  return P;
}
function whoaPose(b0) {
  const songBeat = b0 / 2, n = Math.floor(songBeat), q = songBeat - n;
  const cur = n % 2 ? 1 : -1;
  const P = mixPose(whoaSide(-cur), whoaSide(cur), ease(clamp(q / 0.15, 0, 1)));
  P.bob = -0.03 * Math.max(0, 1 - q * 4); // little dip on the hit
  return P;
}

// Forward kinematics → piece transforms {x, y, rot, jaw}
function solve(sk, P) {
  const u = sk.h / 8, out = {};
  const seg = (name, x0, y0, a, len) => {
    const dx = Math.sin(a), dy = Math.cos(a), x1 = x0 + dx * len, y1 = y0 + dy * len;
    out[name] = { x: (x0 + x1) / 2, y: (y0 + y1) / 2, rot: Math.atan2(dy, dx) - Math.PI / 2 };
    return [x1, y1];
  };
  const thigh = 1.9 * u, shin = 1.8 * u;
  // pelvis height = the longer leg's vertical reach (so bent knees crouch), plus any jump
  const reach = (h, k) => thigh * Math.cos(h) + shin * Math.cos(h + k);
  const px = sk.x + P.sx * u * 3;
  const pelY = sk.ground - 0.15 * u - Math.max(reach(P.hipL, P.knL), reach(P.hipR, P.knR)) - P.bob * sk.h;
  out.pelvis = { x: px, y: pelY, rot: -P.lean };
  // spine goes up
  const [nx, ny] = seg('spine', px, pelY - 0.2 * u, P.lean + Math.PI, 3.1 * u);
  out.ribs = { x: lerp(px, nx, 0.62), y: lerp(pelY - 0.2 * u, ny, 0.62), rot: -P.lean };
  const ha = P.lean + P.head;
  out.skull = { x: nx - Math.sin(ha) * 0.8 * u, y: ny - Math.cos(ha) * 0.8 * u + P.nod * 0.4 * u, rot: -ha, jaw: P.jaw, nod: P.nod };
  // shoulders (perpendicular to spine)
  const shW = 0.95 * u, cl = Math.cos(P.lean), sl = Math.sin(P.lean);
  const shX = lerp(px, nx, 0.88), shY = lerp(pelY, ny, 0.88);
  let e = seg('humL', shX - cl * shW, shY + sl * shW, -P.shL, 1.45 * u);
  e = seg('radL', e[0], e[1], -P.shL - P.elL, 1.3 * u);
  seg('handL', e[0], e[1], -P.shL - P.elL, 0.5 * u);
  e = seg('humR', shX + cl * shW, shY - sl * shW, -P.shR, 1.45 * u);
  e = seg('radR', e[0], e[1], -P.shR - P.elR, 1.3 * u);
  seg('handR', e[0], e[1], -P.shR - P.elR, 0.5 * u);
  // legs
  const hW = 0.45 * u;
  let k = seg('femL', px - cl * hW, pelY + 0.1 * u, -P.hipL, thigh);
  k = seg('tibL', k[0], k[1], -P.hipL - P.knL, shin);
  out.footL = { x: k[0] - 0.25 * u, y: k[1] + 0.08 * u, rot: Math.PI / 2 };
  k = seg('femR', px + cl * hW, pelY + 0.1 * u, -P.hipR, thigh);
  k = seg('tibR', k[0], k[1], -P.hipR - P.knR, shin);
  out.footR = { x: k[0] + 0.25 * u, y: k[1] + 0.08 * u, rot: -Math.PI / 2 };
  return out;
}

// Rotate a whole posed skeleton about a pivot (used for lying down → standing up)
function rotateAll(pose, cx, cy, a) {
  const c = Math.cos(a), s = Math.sin(a), o = {};
  for (const k in pose) {
    const p = pose[k], dx = p.x - cx, dy = p.y - cy;
    o[k] = { ...p, x: cx + dx * c - dy * s, y: cy + dx * s + dy * c, rot: p.rot + a };
  }
  return o;
}

// ---------- Bone drawing ----------
function longBone(ctx, len, w) {
  const r = w * 0.85;
  ctx.beginPath();
  ctx.moveTo(-w * 0.35, -len / 2 + r * 0.6); ctx.lineTo(-w * 0.3, len / 2 - r * 0.6);
  ctx.lineTo(w * 0.3, len / 2 - r * 0.6); ctx.lineTo(w * 0.35, -len / 2 + r * 0.6); ctx.closePath(); ctx.fill();
  for (const y of [-len / 2, len / 2]) {
    ctx.beginPath(); ctx.arc(-r * 0.45, y, r * 0.55, 0, 7); ctx.arc(r * 0.45, y, r * 0.55, 0, 7); ctx.fill();
  }
}
function drawFlower(ctx, x, y, r, color, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.fillStyle = color;
  for (let i = 0; i < 6; i++) { ctx.rotate(Math.PI / 3); ctx.beginPath(); ctx.ellipse(0, -r * 0.55, r * 0.32, r * 0.55, 0, 0, 7); ctx.fill(); }
  ctx.fillStyle = '#ffcf33'; ctx.beginPath(); ctx.arc(0, 0, r * 0.3, 0, 7); ctx.fill();
  ctx.restore();
}
function drawPiece(ctx, name, sk, u, eyeGlow, jaw, nod = 0, flower = 0) {
  ctx.fillStyle = BONE; ctx.strokeStyle = BONE; ctx.lineCap = 'round';
  switch (name) {
    case 'skull': {
      const r = 0.62 * u;
      if (nod) ctx.scale(1, 1 - 0.12 * Math.min(nod, 1.5)); // looking down
      ctx.beginPath(); ctx.ellipse(0, -r * 0.15, r * 0.9, r, 0, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.roundRect(-r * 0.55, r * 0.45, r * 1.1, r * 0.45, r * 0.15); ctx.fill();
      // jaw (chatters to the beat)
      const jo = jaw * r * 0.35;
      ctx.beginPath(); ctx.roundRect(-r * 0.5, r * 0.85 + jo, r, r * 0.38, r * 0.18); ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath(); ctx.ellipse(-r * 0.36, -r * 0.05, r * 0.24, r * 0.29, 0.2, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.ellipse(r * 0.36, -r * 0.05, r * 0.24, r * 0.29, -0.2, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.moveTo(0, r * 0.22); ctx.lineTo(-r * 0.1, r * 0.44); ctx.lineTo(r * 0.1, r * 0.44); ctx.fill();
      ctx.lineWidth = r * 0.06; ctx.strokeStyle = '#000';
      for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.moveTo(i * r * 0.18, r * 0.62); ctx.lineTo(i * r * 0.18, r * 0.9); ctx.stroke(); }
      if (eyeGlow > 0) {
        ctx.fillStyle = `rgba(255,200,90,${eyeGlow})`;
        ctx.beginPath(); ctx.arc(-r * 0.36, -r * 0.03, r * 0.11, 0, 7); ctx.arc(r * 0.36, -r * 0.03, r * 0.11, 0, 7); ctx.fill();
      }
      break;
    }
    case 'spine': {
      const len = 3.1 * u;
      for (let i = 0; i < 11; i++) {
        const y = -len / 2 + (i + 0.5) * len / 11, w = u * (0.26 - i * 0.008);
        ctx.beginPath(); ctx.roundRect(-w / 2, y - u * 0.1, w, u * 0.2, u * 0.06); ctx.fill();
      }
      break;
    }
    case 'ribs': {
      ctx.lineWidth = u * 0.1;
      for (let i = 0; i < 6; i++) {
        const y = -u * 0.8 + i * u * 0.27, rw = u * (0.6 + Math.sin((i + 1.5) / 7 * Math.PI) * 0.4);
        for (const m of [-1, 1]) {
          ctx.beginPath(); ctx.moveTo(0, y);
          ctx.bezierCurveTo(m * rw * 1.1, y - u * 0.12, m * rw * 1.15, y + u * 0.3, m * rw * 0.55, y + u * 0.42); ctx.stroke();
        }
      }
      ctx.beginPath(); ctx.roundRect(-u * 0.08, -u * 0.85, u * 0.16, u * 1.35, u * 0.08); ctx.fill(); // sternum
      break;
    }
    case 'pelvis': {
      ctx.beginPath();
      ctx.moveTo(-u * 0.85, -u * 0.35);
      ctx.quadraticCurveTo(-u * 0.95, u * 0.25, -u * 0.25, u * 0.45);
      ctx.lineTo(u * 0.25, u * 0.45);
      ctx.quadraticCurveTo(u * 0.95, u * 0.25, u * 0.85, -u * 0.35);
      ctx.quadraticCurveTo(0, -u * 0.05, -u * 0.85, -u * 0.35); ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath(); ctx.ellipse(-u * 0.38, u * 0.12, u * 0.17, u * 0.13, 0, 0, 7); ctx.ellipse(u * 0.38, u * 0.12, u * 0.17, u * 0.13, 0, 0, 7); ctx.fill();
      break;
    }
    case 'humL': case 'humR': longBone(ctx, 1.45 * u, u * 0.2); break;
    case 'radL': case 'radR': longBone(ctx, 1.3 * u, u * 0.17); break;
    case 'femL': case 'femR': longBone(ctx, 1.9 * u, u * 0.24); break;
    case 'tibL': case 'tibR': longBone(ctx, 1.8 * u, u * 0.21); break;
    case 'handL': case 'handR': {
      ctx.beginPath(); ctx.ellipse(0, -u * 0.08, u * 0.13, u * 0.12, 0, 0, 7); ctx.fill();
      ctx.lineWidth = u * 0.055;
      for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.moveTo(i * u * 0.05, 0); ctx.lineTo(i * u * 0.08, u * 0.3); ctx.stroke(); }
      if (flower > 0) drawFlower(ctx, 0, u * 0.45, u * 0.42 * flower, sk.flower, sk.x * 0.01);
      break;
    }
    case 'footL': case 'footR': {
      ctx.beginPath(); ctx.ellipse(0, 0, u * 0.14, u * 0.34, 0, 0, 7); ctx.fill();
      ctx.lineWidth = u * 0.06;
      for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.moveTo(i * u * 0.05, u * 0.2); ctx.lineTo(i * u * 0.06, u * 0.45); ctx.stroke(); }
      break;
    }
  }
}

// ---------- Particles (dust, breath) ----------
const DUST = Array.from({ length: 140 }, () => ({ x: R() * W, y: 700 + R() * 380, s: 1 + R() * 2.5, sp: 0.3 + R(), ph: R() * 100 }));
const BREATH = Array.from({ length: 220 }, () => ({ a: R() * Math.PI * 2, r: 200 + R() * 900, sp: 0.4 + R() * 0.9, s: 1 + R() * 2.2, ph: R() }));
const FIRE = Array.from({ length: 520 }, () => ({ x: R() * W, sp: 0.5 + R(), s: 1.5 + R() * 3, ph: R(), wob: R() * 10, big: R() < 0.22 }));
const GROUND_FLOWERS = Array.from({ length: 110 }, (_, i) => {
  const back = i % 3 === 0;
  return { x: R() * W, y: back ? 872 + R() * 12 : 1040 + R() * 34, r: (back ? 7 : 11) + R() * (back ? 6 : 12), stem: (back ? 12 : 22) + R() * (back ? 18 : 40),
           color: FLOWER_COLORS[Math.floor(R() * FLOWER_COLORS.length)], delay: R() * 9, sway: R() * 10, back };
});
const PETALS = Array.from({ length: 110 }, () => ({ x: R() * W, sp: 0.5 + R(), ph: R(), s: 4 + R() * 6, spin: R() * 10, color: FLOWER_COLORS[Math.floor(R() * FLOWER_COLORS.length)] }));
const SPARKS = Array.from({ length: 40 }, () => ({ dx: R() - 0.5, sp: 0.5 + R(), ph: R(), s: 1 + R() * 2 }));

function drawFire(c, t, lvl) {
  if (lvl <= 0) return;
  c.save(); c.globalCompositeOperation = 'lighter';
  const g = c.createLinearGradient(0, H, 0, H - 420);
  g.addColorStop(0, `rgba(255,90,20,${0.28 * lvl})`); g.addColorStop(1, 'rgba(255,60,0,0)');
  c.fillStyle = g; c.fillRect(0, H - 420, W, 420);
  for (const p of FIRE) {
    const k = (t * p.sp * 0.17 + p.ph) % 1, y = H + 20 - k * H * 0.62;
    const x = p.x + Math.sin(t * 1.3 + p.wob) * 30 * k;
    const flick = 0.75 + 0.25 * Math.sin(t * 9 + p.wob * 3);
    const r = p.s * (1 - k * 0.6) * (p.big ? 7 : 1);
    const [cr, cg, cb] = k < 0.3 ? [255, 210, 110] : k < 0.65 ? [255, 130, 40] : [210, 50, 20];
    c.fillStyle = `rgba(${cr},${cg},${cb},${lvl * (1 - k) * flick * (p.big ? 0.07 : 0.75)})`;
    c.beginPath(); c.arc(x, y, r, 0, 7); c.fill();
  }
  c.restore();
}

function drawRay(c, sk, t, lvl) {
  if (lvl <= 0) return;
  c.save(); c.globalCompositeOperation = 'lighter';
  const top = sk.h * 0.25, bot = sk.h * 0.95;
  const g = c.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, `rgba(255,246,220,${0.28 * lvl})`); g.addColorStop(0.45, `rgba(255,244,214,${0.34 * lvl})`); g.addColorStop(1, `rgba(255,236,190,${0.14 * lvl})`);
  c.fillStyle = g; c.beginPath();
  c.moveTo(sk.x - top / 2, 0); c.lineTo(sk.x + top / 2, 0); c.lineTo(sk.x + bot / 2, H); c.lineTo(sk.x - bot / 2, H); c.fill();
  for (const p of SPARKS) {
    const k = (t * p.sp * 0.3 + p.ph) % 1, y = sk.ground - k * sk.ground, wdt = lerp(bot, top, k);
    c.fillStyle = `rgba(255,250,230,${lvl * (1 - k) * 0.9})`; c.beginPath(); c.arc(sk.x + p.dx * wdt * 0.8, y, p.s, 0, 7); c.fill();
  }
  c.restore();
}

function drawGroundFlowers(c, t, back) {
  const bl = bloom(t);
  if (bl <= 0) return;
  for (const f of GROUND_FLOWERS) {
    if (f.back !== back) continue;
    const g = smooth(T_TOGETHER + f.delay, T_TOGETHER + f.delay + 3, t);
    if (g <= 0) continue;
    const sw = Math.sin(t * 1.5 + f.sway) * 0.12, tx = f.x + Math.sin(sw) * f.stem * g, ty = f.y - f.stem * g;
    c.strokeStyle = '#5fae4a'; c.lineWidth = back ? 2 : 3; c.beginPath(); c.moveTo(f.x, f.y); c.quadraticCurveTo(f.x, (f.y + ty) / 2, tx, ty); c.stroke();
    drawFlower(c, tx, ty, f.r * g, f.color, f.sway + t * 0.2);
  }
}

function drawPetals(c, t) {
  const bl = bloom(t);
  if (bl <= 0) return;
  for (const p of PETALS) {
    const y = 430 + ((t * 32 * p.sp + p.ph * 650) % 650), x = p.x + Math.sin(t * 0.7 * p.sp + p.ph * 10) * 70;
    c.save(); c.globalAlpha = bl * 0.85; c.translate(x, y); c.rotate(t * p.sp + p.spin); c.fillStyle = p.color;
    c.beginPath(); c.ellipse(0, 0, p.s, p.s * 0.5, 0, 0, 7); c.fill(); c.restore();
  }
}

// ---------- Scene ----------
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const scene = document.createElement('canvas'); scene.width = W; scene.height = H;
const sctx = scene.getContext('2d');
const glow = document.createElement('canvas'); glow.width = W / 4; glow.height = H / 4;
const gctx = glow.getContext('2d');

function wrap(c, text, maxW) {
  const words = text.split(' '), lines = []; let line = '';
  for (const w of words) { const test = line ? line + ' ' + w : w; if (c.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test; }
  if (line) lines.push(line); return lines;
}

function drawText(c, t) {
  const v = VERSES.find(v => t >= v[0] && t < v[1]); if (!v) return;
  const a = Math.min(smooth(v[0], v[0] + 1, t), 1 - smooth(v[1] - 1, v[1], t));
  c.save(); c.globalAlpha = a; c.textAlign = 'center'; c.textBaseline = 'top';
  c.font = 'italic 58px Georgia, Caladea, "Liberation Serif", serif';
  const lines = wrap(c, '“' + v[2] + '”', 1650);
  let y = 70;
  c.shadowColor = 'rgba(160,200,255,0.6)'; c.shadowBlur = 18; c.fillStyle = '#f6f2e6';
  for (const l of lines) { c.fillText(l, W / 2, y); y += 72; }
  c.shadowBlur = 0; c.font = '600 40px Georgia, Caladea, "Liberation Serif", serif'; c.fillStyle = GOLD;
  c.fillText('— ' + v[3] + ' (KJV)', W / 2, y + 14);
  c.restore();
}

function render(t) {
  t = ((t % LOOP) + LOOP) % LOOP;
  const c = sctx;
  c.setTransform(1, 0, 0, 1, 0, 0); c.fillStyle = '#000'; c.fillRect(0, 0, W, H);

  const first = SKELETONS[WAKE_ORDER[0]].alive;
  const firstLife = smooth(first.tS0, first.tS1, t);
  const fl = bloom(t);

  // ground dust
  for (const d of DUST) {
    const x = (d.x + Math.sin(t * 0.2 * d.sp + d.ph) * 40) % W, y = d.y + Math.sin(t * d.sp + d.ph) * 6;
    c.fillStyle = 'rgba(200,210,230,0.12)'; c.beginPath(); c.arc(x, y, d.s, 0, 7); c.fill();
  }
  drawFire(c, t, fireLevel(t));
  for (const sk of SKELETONS) drawRay(c, sk, t, smooth(sk.tAsc - 4, sk.tAsc - 1, t) * (1 - smooth(sk.tAsc + 8, sk.tAsc + 12, t)));
  drawGroundFlowers(c, t, true);

  SKELETONS.forEach((sk, si) => {
    if (si === 4) drawGroundFlowers(c, t, false); // front-row flowers sit behind the front skeletons' feet
    const u = sk.h / 8, A = sk.alive;
    const rattleAmp = smooth(A.tR, A.tA, t) * (1 - smooth(A.tA + 2, A.tA + 6, t));
    const life = smooth(A.tS0, A.tS1, t);
    const danceIn = smooth(A.tD, A.tD + 2.5, t);
    const w = wildness(sk, t);
    const asc = clamp((t - sk.tAsc) / 9, 0, 1);
    if (asc >= 1) return;
    // breath wind: particles spiral in around this skeleton as it stands
    const bw = smooth(A.tS0 - 2, A.tS0, t) * (1 - smooth(A.tS1, A.tS1 + 2, t));
    if (bw > 0) {
      const spread = A === first ? 1 : 0.35 * sk.h / 390, cy = A === first ? 650 : sk.ground - sk.h * 0.5;
      for (const p of BREATH) {
        const k = ((t * p.sp * 0.25 + p.ph) % 1), r = p.r * (1 - k) * spread, a = p.a + k * 4;
        c.fillStyle = `rgba(170,210,255,${bw * (1 - k) * 0.8})`; c.beginPath(); c.arc((A === first ? W / 2 : sk.x) + Math.cos(a) * r * 1.2, cy + Math.sin(a) * r * 0.45, p.s, 0, 7); c.fill();
      }
    }
    const P = mixPose(REST, dancePose(sk, Math.max(t, A.tD)), danceIn);
    let pose = solve(sk, P);
    // lying → standing
    const stand = smooth(A.tS0, A.tS1, t);
    const lieAng = sk.lieDir * Math.PI / 2 * (1 - stand);
    if (t < A.tS1) {
      // lie centered on sk.x, then rise up (rotate about body middle, drop to the ground while lying)
      pose = rotateAll(pose, sk.x, sk.ground - sk.h * 0.48, lieAng);
      const drop = (sk.h * 0.48 - u * 0.55) * Math.abs(Math.sin(lieAng));
      for (const k in pose) pose[k].y += drop;
      for (const k in pose) pose[k].y = Math.min(pose[k].y, sk.ground - 6);
    }

    const eyes = Math.min(1, life * (0.75 + 0.25 * w * Math.abs(Math.sin(t * Math.PI * SONG_BPM / 60))) / 0.75);
    for (const name of PIECES) {
      const sc = sk.scatter[name], tp = pose[name];
      let x, y, rot, alpha = sk.alpha;
      if (t < A.tA) {
        x = sc.x; y = sc.y; rot = sc.rot;
        const j = rattleAmp * (0.5 + 0.5 * Math.sin(t * 3 + sc.jit));
        x += Math.sin(t * 47 + sc.jit) * 4 * j; y -= Math.abs(Math.sin(t * 31 + sc.jit)) * 14 * j; rot += Math.sin(t * 39 + sc.jit) * 0.15 * j;
      } else {
        const k = ease(clamp((t - A.tA - sc.delay * A.spread / 5.5) / 2.2, 0, 1));
        x = lerp(sc.x, tp.x, k); y = lerp(sc.y, tp.y, k) - Math.sin(k * Math.PI) * sc.arc; rot = lerpAng(sc.rot, tp.rot, k);
        if (k < 1 && k > 0) rot += Math.sin(k * Math.PI) * 2 * (sc.jit % 2 > 1 ? 1 : -1);
        if (w > 0) { x += Math.sin(t * 43 + sc.jit) * 3 * w; y += Math.sin(t * 37 + sc.jit * 2) * 3 * w; rot += Math.sin(t * 29 + sc.jit) * 0.08 * w; }
        if (asc > 0) {
          // rise into the light: bones drift gently apart as they go up and fade into the beam
          const a2 = asc * asc;
          y -= a2 * (sk.ground + 200 + sc.arc * 1.5);
          x += Math.sin(asc * 3 + sc.jit) * 25 * asc;
          rot += asc * ((sc.jit % 1) - 0.5) * 2;
          alpha *= 1 - smooth(0.5, 1, asc);
        }
      }
      c.save(); c.globalAlpha = alpha; c.translate(x, y); c.rotate(rot);
      const isSkull = name === 'skull', isHand = name === 'handL' || name === 'handR';
      drawPiece(c, name, sk, u, Math.max(eyes, asc > 0 ? 1 : 0),
        isSkull ? (tp.jaw || 0) * danceIn : 0, isSkull ? (tp.nod || 0) * danceIn : 0, isHand ? fl : 0);
      c.restore();
    }
  });
  drawPetals(c, t);

  drawText(c, t);

  // composite with a soft glow
  const wAvg = wildness(SKELETONS[6], t);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'source-over'; ctx.drawImage(scene, 0, 0);
  gctx.clearRect(0, 0, glow.width, glow.height); gctx.filter = 'blur(6px)'; gctx.drawImage(scene, 0, 0, glow.width, glow.height); gctx.filter = 'none';
  ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = Math.min(1, 0.55 + 0.35 * firstLife + 0.35 * wAvg * Math.pow(Math.abs(Math.cos(t * Math.PI * SONG_BPM / 60)), 4)); ctx.drawImage(glow, 0, 0, W, H);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  // fade in from black at the start, fade to black at the end
  const vis = smooth(0, 2.5, t) * (1 - smooth(T_BLACK0, T_BLACK1, t));
  if (vis < 1) { ctx.fillStyle = `rgba(0,0,0,${1 - vis})`; ctx.fillRect(0, 0, W, H); }
}

// Exposed for offline video rendering
window.renderAt = render;
window.LOOP = LOOP;

if (!new URLSearchParams(location.search).has('render')) {
  // Plays immediately and repeats forever. A tap restarts from 0:00 so you can line it up with the song.
  let t0 = performance.now();
  const tick = now => { render((now - t0) / 1000); requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
  document.addEventListener('click', () => {
    t0 = performance.now();
    try { document.documentElement.requestFullscreen?.()?.catch(() => {}); } catch (e) {}
    try { navigator.wakeLock?.request('screen').catch(() => {}); } catch (e) {}
  });
}
</script>
</body>
</html>
