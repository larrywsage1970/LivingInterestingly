name: IPAWS probe (temporary)
on:
  push:
    branches: [claude/ipaws-fix]
    paths: [".github/workflows/ipaws-probe.yml", "stow-grid-watch/tools/ipaws_probe.py"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install httpx==0.28.1 && python stow-grid-watch/tools/ipaws_probe.py
