name: FirstEnergy probe (temporary)
on:
  push:
    branches: [claude/firstenergy]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - working-directory: stow-grid-watch
        run: pip install -q httpx==0.28.1 && python -m tools.fe_probe
