name: Probe (temporary)
on:
  push:
    branches: [claude/inline-details]
    paths: ["stow-grid-watch/tools/**", ".github/workflows/probe.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - working-directory: stow-grid-watch
        env:
          AIRNOW_API_KEY: ${{ secrets.AIRNOW_API_KEY }}
        run: |
          pip install -q -r requirements-dev.txt
          python -m pytest -q
          python -m tools.probe
          SGW_MIN_CADENCE_S=1800 SGW_USER_AGENT="GRID/0.1 (contact: larrywsage@gmail.com)" python -m app.snapshot --out /tmp/site
          python -c "import json;d=json.load(open('/tmp/site/api/status.json'));print('snapshot bytes:', len(json.dumps(d)));print('forecast periods:', len(d['cards']['nws_forecast']['items']))"
