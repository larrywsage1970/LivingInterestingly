name: Probe (temporary)
on:
  push:
    branches: [claude/ohgo]
    paths: ["stow-grid-watch/tools/**", ".github/workflows/probe.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - working-directory: stow-grid-watch
        env:
          OHGO_API_KEY: ${{ secrets.OHGO_API_KEY || secrets.OHGO_API_KE }}
          OHGO_IN_SECRET: ${{ secrets.OHGO_API_KEY != '' }}
          OHGO_IN_VAR: ${{ vars.OHGO_API_KEY != '' }}
        run: pip install -q httpx==0.28.1 && python -m tools.probe
