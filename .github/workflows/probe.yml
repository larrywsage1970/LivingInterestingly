name: Probe (temporary)
on:
  push:
    branches: [claude/more-gov-sources]
    paths: ["stow-grid-watch/tools/**", ".github/workflows/probe.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - working-directory: stow-grid-watch
        env:
          SGW_USER_AGENT: "GRID/0.1 (contact: larrywsage@gmail.com)"
          SGW_MIN_CADENCE_S: "1800"
          AIRNOW_API_KEY: ${{ secrets.AIRNOW_API_KEY }}
        run: |
          pip install -q -r requirements-dev.txt
          python -m pytest -q
          python -m tools.probe
          python -m app.snapshot --out /tmp/site
          if [ -n "$AIRNOW_API_KEY" ] && grep -q "$AIRNOW_API_KEY" /tmp/site/api/status.json; then echo KEY LEAKED; exit 1; fi
