name: PJM probe (temporary)
on:
  push:
    branches: [claude/pjm-alerts]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - working-directory: stow-grid-watch
        env:
          SGW_USER_AGENT: "GRID/0.1 (contact: larrywsage@gmail.com)"
          SGW_MIN_CADENCE_S: "1800"
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: |
          pip install -q -r requirements-dev.txt
          python -m pytest -q
          python -m tools.pjm_probe
          python -m app.snapshot --out /tmp/site
